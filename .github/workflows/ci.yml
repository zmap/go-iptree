name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:

jobs:
  build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version: "1.24"
        - name: Build
          run: |
            go version
            go get ./...
        - name: Unit Tests
          run: go test -v ./...